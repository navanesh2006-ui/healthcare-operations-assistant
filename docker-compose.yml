version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: carebridge_db
    environment:
      POSTGRES_DB: carebridge
      POSTGRES_USER: carebridge
      POSTGRES_PASSWORD: carebridge_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carebridge"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carebridge_backend
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://carebridge:carebridge_password@db:5432/carebridge
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USE_TLS=true
      - SMTP_USER=gmhospital1980@gmail.com
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_NAME=CareBridge
      - HOSPITAL_DEMO_EMAIL=gmhospital1980@gmail.com
      - PUBLIC_BASE_URL=http://localhost:3000
      - SECOND_BRAIN_PATH=./second-brain
      - SECRET_KEY=carebridge_secret_key_for_hackforge_code_a_thon_2026
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./second-brain:/app/second-brain
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: carebridge_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads_data:
